<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend - تسجيل الدخول</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-container { max-width:420px; margin:60px auto; padding:var(--space-6); }
        .auth-logo { text-align:center; margin-bottom:var(--space-6); }
        .auth-links { text-align:center; margin-top:var(--space-4); font-size:14px; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-logo">
        <span style="font-size:50px;">🛡️</span>
        <h2>SafeSend</h2>
        <p class="text-muted">منصة الوساطة الآمنة</p>
    </div>
    <div class="card">
        <div class="input-group">
            <span class="input-icon">📧</span>
            <input class="input" type="email" placeholder="البريد الإلكتروني">
        </div>
        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input class="input" type="password" placeholder="كلمة المرور">
        </div>
        <button class="btn btn-primary btn-block mt-3" onclick="window.location.href='/dashboard'">تسجيل الدخول</button>
    </div>
    <div class="auth-links">
        <a href="/register">إنشاء حساب جديد</a> | 
        <a href="/dashboard">تخطي (وضع تجريبي)</a>
    </div>
</div>
</body>
</html>
