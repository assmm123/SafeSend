version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: safesend
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: safesend
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://safesend:${DB_PASSWORD}@postgres/safesend
      REDIS_URL: redis://redis:6379/0

  celery_worker:
    build: .
    command: celery -A src.celery_app worker -l info
    depends_on:
      - redis
      - postgres

  celery_beat:
    build: .
    command: celery -A src.celery_app beat -l info
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
