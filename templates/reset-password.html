<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend - تعيين كلمة مرور جديدة</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">

<div class="glass-card" style="width:100%;max-width:420px;padding:30px;">
    <div class="text-center mb-4">
        <div style="font-size:45px;">🆕</div>
        <h2 style="font-weight:800;margin-top:8px;">كلمة مرور جديدة</h2>
        <p class="text-muted mt-2">أدخل كلمة المرور الجديدة لحسابك</p>
    </div>

    <div class="input-group mt-4">
        <span class="input-icon">🔒</span>
        <input class="input" type="password" id="password" placeholder="كلمة المرور الجديدة" oninput="checkStrength()">
    </div>

    <div id="strengthBar" style="height:4px;border-radius:4px;margin-bottom:12px;transition:all 0.3s;width:0%;"></div>
    <p id="strengthText" style="font-size:10px;color:var(--text-muted);margin-top:-8px;margin-bottom:8px;"></p>

    <div class="input-group">
        <span class="input-icon">🔒</span>
        <input class="input" type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" oninput="checkMatch()">
    </div>
    <p id="matchText" style="font-size:10px;color:var(--text-muted);margin-top:-8px;margin-bottom:8px;"></p>

    <div id="message" style="display:none;padding:12px;border-radius:12px;margin-top:12px;font-size:13px;"></div>

    <button class="btn btn-primary btn-block mt-3" id="submitBtn" onclick="resetPassword()">
        <span id="btnText">حفظ كلمة المرور</span>
        <span id="btnLoader" style="display:none;">⏳</span>
    </button>

    <hr class="divider">

    <div class="text-center">
        <a href="/login" style="color:var(--primary);font-size:13px;text-decoration:none;">تذكرت كلمة المرور؟ دخول</a>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

function checkStrength() {
    const pw = document.getElementById('password').value;
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    
    let strength = 0;
    if (pw.length >= 8) strength++;
    if (/[A-Z]/.test(pw)) strength++;
    if (/[0-9]/.test(pw)) strength++;
    if (/[^A-Za-z0-9]/.test(pw)) strength++;
    
    const pct = (strength / 4) * 100;
    bar.style.width = pct + '%';
    
    if (strength <= 1) { bar.style.background = 'var(--danger)'; text.textContent = 'ضعيف'; }
    else if (strength <= 2) { bar.style.background = 'var(--warning)'; text.textContent = 'متوسط'; }
    else if (strength <= 3) { bar.style.background = 'var(--primary)'; text.textContent = 'قوي'; }
    else { bar.style.background = 'var(--accent)'; text.textContent = 'قوي جداً'; }
}

function checkMatch() {
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const text = document.getElementById('matchText');
    
    if (!confirm) { text.textContent = ''; return; }
    if (pw === confirm) { text.textContent = '✅ كلمات المرور متطابقة'; text.style.color = 'var(--accent)'; }
    else { text.textContent = '❌ كلمات المرور غير متطابقة'; text.style.color = 'var(--danger)'; }
}

async function resetPassword() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('message');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');

    if (!token) { showMessage('error', '❌ رابط غير صالح - الرمز مفقود'); return; }
    if (password.length < 8) { showMessage('error', '❌ كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }
    if (!/[A-Z]/.test(password)) { showMessage('error', '❌ يجب أن تحتوي على حرف كبير'); return; }
    if (!/[0-9]/.test(password)) { showMessage('error', '❌ يجب أن تحتوي على رقم'); return; }
    if (password !== confirm) { showMessage('error', '❌ كلمات المرور غير متطابقة'); return; }

    btn.disabled = true;
    btnText.style.display = 'none';
    btnLoader.style.display = 'inline';
    msg.style.display = 'none';

    try {
        const response = await fetch('/api/v1/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token, password: password})
        });

        const data = await response.json();

        if (response.ok) {
            showMessage('success', '✅ تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.');
            setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
            showMessage('error', data.message_ar || '❌ فشل إعادة تعيين كلمة المرور');
        }
    } catch (error) {
        showMessage('error', '❌ خطأ في الاتصال. حاول مرة أخرى');
    }

    btn.disabled = false;
    btnText.style.display = 'inline';
    btnLoader.style.display = 'none';
}

function showMessage(type, text) {
    const msg = document.getElementById('message');
    msg.style.display = 'block';
    msg.textContent = text;
    msg.style.background = type === 'success' ? 'rgba(34,228,172,0.12)' : 'rgba(255,75,106,0.12)';
    msg.style.color = type === 'success' ? 'var(--accent)' : 'var(--danger)';
    msg.style.border = `1px solid ${type === 'success' ? 'rgba(34,228,172,0.5)' : 'rgba(255,75,106,0.5)'}`;
}
</script>
</body>
</html>
