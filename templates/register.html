<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend - تسجيل</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link rel="stylesheet" href="/static/css/safesend-enhanced.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #0d904f 0%, #065a2c 100%); }
        .auth-card { background:var(--surface); border-radius:20px; padding:40px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div style="text-align:center;margin-bottom:30px;">
            <span class="icon-2xl">📝</span>
            <h2 style="margin-top:12px;">إنشاء حساب</h2>
            <p class="text-muted">انضم إلى SafeSend</p>
        </div>
        <input class="input" placeholder="الاسم الكامل">
        <input class="input" placeholder="اسم المستخدم">
        <div class="input-group"><span class="input-icon">📧</span><input class="input" placeholder="البريد الإلكتروني"></div>
        <div class="input-group"><span class="input-icon">🔒</span><input class="input" type="password" placeholder="كلمة المرور"></div>
        <a href="/dashboard" class="btn btn-primary btn-block mt-4" style="text-decoration:none;background:var(--success);">إنشاء الحساب</a>
        <div style="text-align:center;margin-top:20px;font-size:14px;">
            <a href="/login">لديك حساب؟</a>
        </div>
    </div>
</div>
</body>
</html>
