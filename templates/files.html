<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend - الملفات</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
</head>
<body>
<main class="container animate-in" style="padding-top:20px;padding-bottom:80px;">
    <h2 class="mb-4">📁 ملفاتي</h2>
    
    <div class="grid-auto">
        <div class="card card-interactive text-center">
            <span class="icon-xl">📄</span>
            <p class="font-bold mt-2">design-v1.psd</p>
            <p class="text-muted">2.4 MB · 12 مايو</p>
            <span class="badge badge-success mt-2">آمن</span>
        </div>
        <div class="card card-interactive text-center">
            <span class="icon-xl">📊</span>
            <p class="font-bold mt-2">report.pdf</p>
            <p class="text-muted">1.1 MB · 10 مايو</p>
            <span class="badge badge-success mt-2">آمن</span>
        </div>
        <div class="card card-interactive text-center">
            <span class="icon-xl">📝</span>
            <p class="font-bold mt-2">contract.docx</p>
            <p class="text-muted">856 KB · 8 مايو</p>
            <span class="badge badge-warning mt-2">قيد الفحص</span>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/dashboard" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="/chat" class="nav-item"><span class="nav-icon">💬</span>محادثات</a>
        <a href="/deals/new" class="nav-item"><span class="nav-icon">➕</span>جديد</a>
        <a href="/notifications" class="nav-item"><span class="nav-icon">🔔</span>تنبيهات</a>
        <a href="/profile" class="nav-item active"><span class="nav-icon">👤</span>حسابي</a>
    </nav>
</main>
</body>
</html>
