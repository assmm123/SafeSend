<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend - استعادة كلمة المرور</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">

<div class="glass-card" style="width:100%;max-width:420px;padding:30px;">
    <div class="text-center mb-4">
        <div style="font-size:45px;">🔑</div>
        <h2 style="font-weight:800;margin-top:8px;">استعادة كلمة المرور</h2>
        <p class="text-muted mt-2">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين</p>
    </div>

    <div class="input-group mt-4">
        <span class="input-icon">📧</span>
        <input class="input" type="email" id="email" placeholder="البريد الإلكتروني المسجل" required>
    </div>

    <div id="message" style="display:none;padding:12px;border-radius:12px;margin-top:12px;font-size:13px;"></div>

    <button class="btn btn-primary btn-block mt-3" id="submitBtn" onclick="sendResetLink()">
        <span id="btnText">إرسال رابط الاستعادة</span>
        <span id="btnLoader" style="display:none;">⏳</span>
    </button>

    <p id="timer" style="display:none;text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px;"></p>

    <hr class="divider">

    <div class="text-center">
        <a href="/login" style="color:var(--primary);font-size:13px;text-decoration:none;">تذكرت كلمة المرور؟ دخول</a>
    </div>
</div>

<script>
let cooldown = 0;
let timerInterval = null;

async function sendResetLink() {
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('message');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const timer = document.getElementById('timer');

    if (!email) {
        showMessage('error', 'يرجى إدخال البريد الإلكتروني');
        return;
    }

    if (cooldown > 0) {
        showMessage('error', `يرجى الانتظار ${cooldown} ثانية`);
        return;
    }

    btn.disabled = true;
    btnText.style.display = 'none';
    btnLoader.style.display = 'inline';
    msg.style.display = 'none';

    try {
        const response = await fetch('/api/v1/auth/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        });

        const data = await response.json();

        if (response.ok) {
            showMessage('success', '✅ تم إرسال رابط الاستعادة إلى بريدك الإلكتروني');
            startCooldown(60);
        } else {
            showMessage('error', data.message_ar || '❌ فشل إرسال رابط الاستعادة');
        }
    } catch (error) {
        showMessage('error', '❌ خطأ في الاتصال. حاول مرة أخرى');
    }

    btn.disabled = false;
    btnText.style.display = 'inline';
    btnLoader.style.display = 'none';
}

function showMessage(type, text) {
    const msg = document.getElementById('message');
    msg.style.display = 'block';
    msg.textContent = text;
    msg.style.background = type === 'success' ? 'rgba(34,228,172,0.12)' : 'rgba(255,75,106,0.12)';
    msg.style.color = type === 'success' ? 'var(--accent)' : 'var(--danger)';
    msg.style.border = `1px solid ${type === 'success' ? 'rgba(34,228,172,0.5)' : 'rgba(255,75,106,0.5)'}`;
}

function startCooldown(seconds) {
    cooldown = seconds;
    const timer = document.getElementById('timer');
    timer.style.display = 'block';
    
    timerInterval = setInterval(() => {
        cooldown--;
        timer.textContent = `يمكنك إعادة المحاولة بعد ${cooldown} ثانية`;
        if (cooldown <= 0) {
            clearInterval(timerInterval);
            timer.style.display = 'none';
        }
    }, 1000);
}
</script>
</body>
</html>
