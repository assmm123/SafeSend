<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SafeSend</title>
<link rel="stylesheet" href="/static/css/safesend.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body style="background:var(--bg);color:var(--text);font-family:Tajawal;padding:20px;min-height:100vh;">
<div class="container" style="padding-bottom:100px;">

<div style="background:var(--glass);border:1px solid var(--border-glass);border-radius:26px;padding:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
<div><h1 style="color:var(--primary);">SafeSend</h1><p class="text-muted" id="userName">---</p></div>
<div><span class="status-pill"><span class="status-dot"></span>متصل</span>
<button onclick="logout()" class="btn btn-ghost btn-sm">🚪</button></div>
</div>

<div class="grid-2 mb-4" id="statsGrid"></div>

<div style="margin:12px 0;font-weight:600;color:var(--text-muted);">إجراءات سريعة</div>
<div style="display:flex;gap:8px;margin-bottom:12px;">
<a href="/deals/new" class="chip chip-primary">＋ صفقة جديدة</a>
<a href="/chat" class="chip">💬 الرسائل</a>
<a href="/files" class="chip">📁 ملفاتي</a>
</div>

<div style="margin:12px 0;font-weight:600;color:var(--text-muted);">صفقاتي</div>
<div id="dealsList"></div>
<p id="loading" class="text-center text-muted" style="padding:20px;">⏳ جاري التحميل...</p>

<div class="bottom-nav">
<a href="/dashboard" class="nav-item active"><span class="nav-icon">🏠</span>الرئيسية</a>
<a href="/chat" class="nav-item"><span class="nav-icon">💬</span>محادثات</a>
<a href="/deals/new" class="nav-item"><span class="nav-icon">＋</span>جديد</a>
<a href="/notifications" class="nav-item"><span class="nav-icon">🔔</span>تنبيهات</a>
<a href="/profile" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
</div>
</div>
<script>
const token=localStorage.getItem('safesend_token');
if(!token){window.location.href='/login';}
async function load(){
try{
const me=await fetch('/api/v1/auth/me',{headers:{'Authorization':'Bearer '+token}});
const u=(await me.json()).user;
document.getElementById('userName').textContent=u.username+' · ⭐'+u.rating;
const s=await fetch('/api/v1/deals/stats',{headers:{'Authorization':'Bearer '+token}});
const st=(await s.json()).stats;
document.getElementById('statsGrid').innerHTML=`
<div class="stat-widget"><div class="stat-value">${st.active||0}</div><div class="stat-label">نشطة</div></div>
<div class="stat-widget"><div class="stat-value">${st.completed||0}</div><div class="stat-label">مكتملة</div></div>
<div class="stat-widget"><div class="stat-value">${u.rating||0}</div><div class="stat-label">⭐ تقييم</div></div>
<div class="stat-widget"><div class="stat-value">$${st.total_volume||0}</div><div class="stat-label">حجم</div></div>`;
const d=await fetch('/api/v1/deals',{headers:{'Authorization':'Bearer '+token}});
const deals=(await d.json()).deals;
document.getElementById('dealsList').innerHTML=deals.slice(0,5).map(d=>`
<div class="deal-item"><div class="deal-top"><span class="deal-title">${d.title}</span><span class="badge badge-warning">${d.status}</span></div><div class="deal-meta">$${d.amount}</div></div>
`).join('');
}catch(e){}
document.getElementById('loading').style.display='none';
}
function logout(){localStorage.removeItem('safesend_token');window.location.href='/login';}
load();
</script>
</body></html>
