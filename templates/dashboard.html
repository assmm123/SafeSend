<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" id="csrf-token">
    <title>SafeSend - لوحة التحكم</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .stat-widget {
            background: var(--glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .stat-widget:hover { transform: translateY(-2px); }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(34,228,172,0.12);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .chip {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--surface);
            transition: all 0.2s;
        }
        .chip:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .chip-primary { background: var(--primary); color: white; border-color: var(--primary); }
        
        .deal-item {
            background: var(--glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .deal-item:hover { background: var(--surface-hover); }
        .deal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .deal-title { font-weight: 600; }
        .deal-meta { font-size: 13px; color: var(--text-muted); }
        .deal-amount { font-weight: 700; color: var(--accent); }
        
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-warning { background: rgba(255,165,0,0.15); color: orange; }
        .badge-success { background: rgba(34,228,172,0.15); color: var(--accent); }
        .badge-info { background: rgba(26,115,232,0.15); color: var(--primary); }
        .badge-danger { background: rgba(255,75,106,0.15); color: var(--danger); }
        
        .error-msg {
            background: rgba(255,75,106,0.1);
            border: 1px solid rgba(255,75,106,0.3);
            border-radius: 12px;
            padding: 12px;
            color: var(--danger);
            text-align: center;
            margin: 12px 0;
        }
        
        .quick-actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr 1fr; }
            .stat-value { font-size: 22px; }
        }
    </style>
</head>
<body style="background:var(--bg);color:var(--text);font-family:Tajawal;padding:20px;min-height:100vh;">

<div class="container" style="padding-bottom:100px;">

    <!-- Header -->
    <div style="background:var(--glass);border:1px solid var(--border-glass);border-radius:26px;padding:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
        <div>
            <h1 style="color:var(--primary);margin:0;">SafeSend</h1>
            <p class="text-muted" id="userName" style="margin:4px 0 0;">---</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="status-pill"><span class="status-dot"></span>متصل</span>
            <button id="btnLogout" class="btn btn-ghost btn-sm" title="تسجيل خروج">🚪</button>
            <button id="btnTheme" class="btn btn-ghost btn-sm" title="تغيير السمة">🌓</button>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid-2 mb-4" id="statsGrid"></div>

    <!-- Quick Actions -->
    <div style="margin:12px 0;font-weight:600;color:var(--text-muted);">⚡ إجراءات سريعة</div>
    <div class="quick-actions">
        <a href="/deals/new" class="chip chip-primary">＋ صفقة جديدة</a>
        <a href="/chat" class="chip">💬 الرسائل</a>
        <a href="/files" class="chip">📁 ملفاتي</a>
        <a href="/profile" class="chip">👤 حسابي</a>
    </div>

    <!-- My Deals -->
    <div style="margin:12px 0;font-weight:600;color:var(--text-muted);">📋 صفقاتي</div>
    <div id="dealsList"></div>

    <!-- Loading -->
    <p id="loading" class="text-center text-muted" style="padding:20px;">⏳ جاري التحميل...</p>

    <!-- Error -->
    <div id="errorMsg" class="error-msg" style="display:none;"></div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="/dashboard" class="nav-item active"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="/chat" class="nav-item"><span class="nav-icon">💬</span>محادثات</a>
        <a href="/deals/new" class="nav-item"><span class="nav-icon">＋</span>جديد</a>
        <a href="/notifications" class="nav-item"><span class="nav-icon">🔔</span>تنبيهات</a>
        <a href="/profile" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>
</div>

<script>
// ============================================
// Theme
// ============================================
(function() {
    var theme = localStorage.getItem('safesend_theme');
    if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
    }
})();

// ============================================
// Helpers
// ============================================
var token = localStorage.getItem('safesend_token');
if (!token) { window.location.href = '/login'; }

function getCSRFToken() {
    var el = document.getElementById('csrf-token');
    return el ? el.getAttribute('content') : '';
}

function getHeaders() {
    var h = { 'Authorization': 'Bearer ' + token };
    var csrf = getCSRFToken();
    if (csrf) h['X-CSRF-Token'] = csrf;
    return h;
}

function formatNumber(n) {
    if (typeof n !== 'number') return n || 0;
    return n.toLocaleString('ar-SA');
}

function formatCurrency(n) {
    if (typeof n !== 'number') return '$' + (n || 0);
    return '$' + n.toLocaleString('ar-SA');
}

function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
}

function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
}

// ============================================
// Logout - REAL API call
// ============================================
async function logout() {
    try {
        await fetch('/api/v1/auth/logout', {
            method: 'POST',
            headers: getHeaders()
        });
    } catch(e) {}
    localStorage.removeItem('safesend_token');
    window.location.href = '/login';
}

// ============================================
// Load Dashboard - Promise.all
// ============================================
async function load() {
    hideError();
    document.getElementById('loading').style.display = 'block';
    
    try {
        var headers = getHeaders();
        
        var results = await Promise.all([
            fetch('/api/v1/auth/me', { headers: headers }),
            fetch('/api/v1/deals/stats', { headers: headers }),
            fetch('/api/v1/deals', { headers: headers })
        ]);
        
        var errors = [];
        if (!results[0].ok) errors.push('الملف الشخصي');
        if (!results[1].ok) errors.push('الإحصائيات');
        if (!results[2].ok) errors.push('الصفقات');
        
        if (errors.length === 3) {
            showError('❌ فشل تحميل البيانات. الرجاء تحديث الصفحة.');
            return;
        }
        
        var userData = results[0].ok ? (await results[0].json()).user : null;
        var statsData = results[1].ok ? (await results[1].json()).stats : {};
        var dealsData = results[2].ok ? (await results[2].json()).deals : [];
        
        if (userData) {
            document.getElementById('userName').textContent = userData.username + ' · ⭐' + (userData.rating || 0);
        }
        
        renderStats(statsData, userData);
        renderDeals(dealsData);
        
        document.getElementById('loading').style.display = 'none';
        
    } catch(e) {
        showError('❌ خطأ في الاتصال: ' + e.message);
    }
}

// ============================================
// Render Stats - NO innerHTML
// ============================================
function renderStats(stats, user) {
    var container = document.getElementById('statsGrid');
    while (container.firstChild) container.removeChild(container.firstChild);
    
    var items = [
        { value: stats.active || 0, label: 'نشطة', icon: '📋', color: 'var(--primary)' },
        { value: stats.completed || 0, label: 'مكتملة', icon: '✅', color: 'var(--accent)' },
        { value: (user && user.rating) || 0, label: '⭐ تقييم', icon: '', color: '#f5a623' },
        { value: formatCurrency(stats.total_volume || 0), label: 'الحجم', icon: '💰', color: 'var(--primary)' }
    ];
    
    items.forEach(function(item) {
        var widget = document.createElement('div');
        widget.className = 'stat-widget';
        
        var val = document.createElement('div');
        val.className = 'stat-value';
        val.style.color = item.color;
        val.textContent = item.value;
        
        var lbl = document.createElement('div');
        lbl.className = 'stat-label';
        lbl.textContent = item.icon + ' ' + item.label;
        
        widget.appendChild(val);
        widget.appendChild(lbl);
        container.appendChild(widget);
    });
}

// ============================================
// Render Deals - NO innerHTML
// ============================================
function renderDeals(deals) {
    var container = document.getElementById('dealsList');
    while (container.firstChild) container.removeChild(container.firstChild);
    
    if (!deals || !deals.length) {
        var empty = document.createElement('p');
        empty.className = 'text-center text-muted';
        empty.style.padding = '20px';
        empty.textContent = 'لا توجد صفقات بعد';
        container.appendChild(empty);
        return;
    }
    
    deals.slice(0, 5).forEach(function(d) {
        var item = document.createElement('div');
        item.className = 'deal-item';
        
        // Top row
        var top = document.createElement('div');
        top.className = 'deal-top';
        
        var title = document.createElement('span');
        title.className = 'deal-title';
        title.textContent = d.title || 'صفقة #' + d.id;
        
        var badge = document.createElement('span');
        badge.className = 'badge';
        var status = d.status || 'pending';
        if (status === 'active' || status === 'in_progress') {
            badge.classList.add('badge-warning');
            badge.textContent = 'قيد التنفيذ';
        } else if (status === 'completed') {
            badge.classList.add('badge-success');
            badge.textContent = 'مكتملة';
        } else if (status === 'disputed') {
            badge.classList.add('badge-danger');
            badge.textContent = 'نزاع';
        } else {
            badge.classList.add('badge-info');
            badge.textContent = status;
        }
        
        top.appendChild(title);
        top.appendChild(badge);
        
        // Meta
        var meta = document.createElement('div');
        meta.className = 'deal-meta';
        
        var amount = document.createElement('span');
        amount.className = 'deal-amount';
        amount.textContent = formatCurrency(d.amount);
        
        meta.appendChild(amount);
        
        item.appendChild(top);
        item.appendChild(meta);
        container.appendChild(item);
    });
}

// ============================================
// Theme Toggle
// ============================================
function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('safesend_theme', next);
}

// ============================================
// Event Listeners
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('btnLogout').addEventListener('click', logout);
    document.getElementById('btnTheme').addEventListener('click', toggleTheme);
    
    // Auto refresh every 60 seconds
    setInterval(load, 60000);
});

// Initial load
load();
</script>
</body></html>
