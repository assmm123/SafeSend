<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" id="csrf-token">
    <title data-i18n="app.name">SafeSend - المحادثات</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --chat-bg: #f5f7fa;
            --chat-sent: #1a73e8;
            --chat-received: #ffffff;
            --sidebar-width: 340px;
            --input-height: 60px;
            --header-height: 56px;
        }
        [data-theme="dark"] {
            --chat-bg: #1a1f2b;
            --chat-sent: #1a73e8;
            --chat-received: #2d333b;
        }
        .chat-layout { display:flex; height:calc(100vh - var(--header-height) - var(--bottom-nav-height)); }
        .chat-sidebar { width:var(--sidebar-width); border-left:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface); flex-shrink:0; }
        .chat-main { flex:1; display:flex; flex-direction:column; background:var(--chat-bg); }
        .chat-messages { flex:1; overflow-y:auto; padding:var(--space-4); display:flex; flex-direction:column; gap:2px; }
        .chat-input-area { background:var(--surface); border-top:1px solid var(--border); padding:var(--space-3); }
        .chat-header { background:var(--surface); border-bottom:1px solid var(--border); padding:var(--space-2) var(--space-4); display:flex; align-items:center; gap:var(--space-3); height:var(--header-height); }
        .bubble { max-width:75%; padding:10px 14px; border-radius:12px; font-size:var(--font-size-sm); line-height:1.5; position:relative; word-break:break-word; animation:fadeIn 0.2s; }
        .bubble.sent { background:var(--chat-sent); color:white; align-self:flex-end; border-bottom-left-radius:4px; }
        .bubble.received { background:var(--chat-received); color:var(--text); align-self:flex-start; border-bottom-right-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
        .bubble .time { font-size:10px; opacity:0.7; margin-top:4px; text-align:right; }
        .bubble .checks { font-size:10px; margin-right:4px; }
        .bubble .checks.read { color:#4fc3f7; }
        .bubble.system { align-self:center; background:transparent; color:var(--text-light); font-size:12px; padding:4px 8px; }
        .bubble .reply-preview { border-right:3px solid rgba(255,255,255,0.5); padding-right:8px; margin-bottom:6px; font-size:11px; opacity:0.8; }
        .typing-indicator { font-size:12px; color:var(--text-light); padding:0 var(--space-4); display:flex;align-items:center;gap:6px; }
        .typing-dots span { width:6px;height:6px;background:var(--text-light);border-radius:50%;display:inline-block;animation:typing 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typing { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); } }
        @keyframes fadeIn { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
        .sidebar-search { padding:var(--space-3); border-bottom:1px solid var(--border); }
        .sidebar-list { flex:1; overflow-y:auto; }
        .chat-item { display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);cursor:pointer;border-bottom:1px solid var(--border-light);transition:background 0.15s; }
        .chat-item:hover { background:var(--surface-hover); }
        .chat-item.active { background:var(--primary-bg); }
        .chat-item .avatar { width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;flex-shrink:0; }
        .chat-item .unread { background:var(--danger);color:white;border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700; }
        .dropdown-menu { position:absolute;top:100%;left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:var(--z-dropdown);min-width:200px;display:none; }
        .dropdown-menu.show { display:block; }
        .dropdown-menu a { display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);color:var(--text);transition:background 0.15s;cursor:pointer; }
        .dropdown-menu a:hover { background:var(--surface-hover); }
        .send-options { display:flex;gap:var(--space-2);padding:var(--space-2) 0; }
        .send-option { padding:6px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);white-space:nowrap; }
        .send-option.active { background:var(--primary);color:white;border-color:var(--primary); }
        .reply-bar { background:var(--bg-secondary);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);margin-bottom:var(--space-2);display:flex;justify-content:space-between;align-items:center;font-size:12px; }
        .voice-recorder { display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2); }
        .voice-wave { flex:1;height:36px;background:var(--bg-secondary);border-radius:var(--radius-sm);overflow:hidden; }
        @media (max-width:768px) { .chat-sidebar { display:none; } .chat-sidebar.mobile-show { display:flex;position:fixed;inset:0;z-index:var(--z-modal);width:100%; } .chat-main.hidden-mobile { display:none; } }
    </style>
</head>
<body>

<div class="chat-layout">
    <!-- Sidebar -->
    <aside class="chat-sidebar" id="chatSidebar">
        <div class="sidebar-search">
            <input type="text" class="input" placeholder="🔍 بحث عن محادثة..." id="searchInput">
        </div>
        <div style="padding:var(--space-2) var(--space-4);display:flex;gap:var(--space-2);font-size:12px;">
            <span class="send-option active" data-filter="all">الكل</span>
            <span class="send-option" data-filter="unread">غير مقروء</span>
            <span class="send-option" data-filter="starred">⭐ مميزة</span>
        </div>
        <div class="sidebar-list" id="chatList"></div>
    </aside>

    <!-- Main Chat -->
    <main class="chat-main" id="chatMain">
        <div class="chat-header">
            <button class="btn btn-ghost btn-icon hide-desktop" id="btnShowSidebar">←</button>
            <div class="avatar" style="background:var(--primary);width:40px;height:40px;" id="chatAvatar"></div>
            <div style="flex:1;">
                <p class="font-semibold" id="chatName"></p>
                <p class="text-xs text-muted" id="chatStatus"></p>
            </div>
            <div style="position:relative;">
                <button class="btn btn-ghost btn-icon" id="btnChatSettings">⋮</button>
                <div class="dropdown-menu" id="chatSettings">
                    <a id="btnMute">🔇 كتم الإشعارات</a>
                    <a id="btnBlock">🚫 حظر المستخدم</a>
                    <a id="btnStarred">⭐ الرسائل المميزة</a>
                    <a id="btnSearch">🔍 بحث في المحادثة</a>
                    <a id="btnExport">📤 تصدير المحادثة</a>
                    <a id="btnClear">🗑️ مسح المحادثة</a>
                    <hr style="border-color:var(--border);margin:4px 0;">
                    <a id="btnDealInfo">ℹ️ معلومات الصفقة</a>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>
        <div class="typing-indicator" id="typingIndicator" style="display:none;">
            <span id="typingUser"></span>
            <span class="typing-dots"><span></span><span></span><span></span></span>
        </div>

        <div class="chat-input-area">
            <div class="reply-bar" id="replyBar" style="display:none;">
                <span>↩️ رد على: <span id="replyText"></span></span>
                <button class="btn btn-ghost btn-icon btn-sm" id="btnCancelReply">✕</button>
            </div>
            <div class="send-options" id="sendOptions" style="display:none;">
                <span class="send-option active" data-type="normal">📸 عادي</span>
                <span class="send-option" data-type="view-once">👁️ مرة واحدة</span>
                <span class="send-option" data-type="disappear">⏰ 24 ساعة</span>
                <span class="send-option" data-type="drm">🔒 DRM محمي</span>
            </div>
            <div style="display:flex;gap:var(--space-2);align-items:flex-end;">
                <button class="btn btn-ghost btn-icon" id="btnFileOptions" title="إرفاق">📎</button>
                <div style="flex:1;position:relative;">
                    <textarea id="messageInput" class="input" rows="1" placeholder="اكتب رسالة..." style="resize:none;min-height:42px;max-height:120px;"></textarea>
                </div>
                <button class="btn btn-ghost btn-icon" id="btnMic" title="تسجيل صوتي">🎤</button>
                <button class="btn btn-primary btn-icon" id="btnSend" title="إرسال">📤</button>
            </div>
            <div class="voice-recorder" id="voiceRecorder" style="display:none;">
                <button class="btn btn-danger btn-icon btn-sm" id="btnCancelRecording">✕</button>
                <div class="voice-wave" id="voiceWave"></div>
                <span id="recordingTime">00:00</span>
                <button class="btn btn-primary btn-sm" id="btnSendVoice">إرسال 🎤</button>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/main.js"></script>
<script>
// ============================================
// Theme
// ============================================
(function() {
    var theme = localStorage.getItem('safesend_theme');
    if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
    }
})();

// ============================================
// CSRF & Auth Helpers
// ============================================
function getCSRFToken() {
    var el = document.getElementById('csrf-token');
    return el ? el.getAttribute('content') : '';
}

function getAuthHeaders() {
    var token = localStorage.getItem('safesend_token');
    var headers = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
    };
    var csrf = getCSRFToken();
    if (csrf) headers['X-CSRF-Token'] = csrf;
    return headers;
}

// ============================================
// State
// ============================================
var chats = [];
var activeChatId = null;
var replyingTo = null;
var sendType = 'normal';
var mediaRecorder = null;
var recordingTimer = null;
var autoReplySettings = {};

try {
    autoReplySettings = JSON.parse(localStorage.getItem('autoReply') || '{"enabled":false,"message":""}');
} catch(e) {
    autoReplySettings = {enabled: false, message: ''};
}

// ============================================
// Load Chats from API
// ============================================
async function loadChats() {
    try {
        var resp = await fetch('/api/v1/messages/conversations', {
            headers: getAuthHeaders()
        });
        if (resp.ok) {
            var data = await resp.json();
            chats = data.conversations || [];
        }
    } catch(e) {
        console.error('Failed to load chats:', e);
    }
    renderChatList();
    if (chats.length > 0 && !activeChatId) {
        openChat(chats[0].id);
    }
}

// ============================================
// Render Chat List - NO innerHTML
// ============================================
function renderChatList(filter) {
    filter = filter || 'all';
    var list = document.getElementById('chatList');
    // Clear safely
    while (list.firstChild) {
        list.removeChild(list.firstChild);
    }

    var filtered = chats;
    if (filter === 'unread') {
        filtered = chats.filter(function(c) { return c.unread > 0; });
    } else if (filter === 'starred') {
        filtered = chats.filter(function(c) { return c.starred; });
    }

    filtered.forEach(function(c) {
        var item = document.createElement('div');
        item.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
        item.onclick = function() { openChat(c.id); };

        var avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.style.background = c.avatar || 'var(--primary)';
        avatar.textContent = (c.name || '?')[0];

        var info = document.createElement('div');
        info.style.cssText = 'flex:1;min-width:0;';

        var topRow = document.createElement('div');
        topRow.style.cssText = 'display:flex;justify-content:space-between;';

        var nameSpan = document.createElement('span');
        nameSpan.className = 'font-semibold';
        nameSpan.textContent = c.name || '';

        var timeSpan = document.createElement('span');
        timeSpan.className = 'text-xs text-muted';
        timeSpan.textContent = c.time || '';

        topRow.appendChild(nameSpan);
        topRow.appendChild(timeSpan);

        var lastMsg = document.createElement('p');
        lastMsg.className = 'text-sm text-muted truncate';
        lastMsg.textContent = c.lastMsg || '';

        info.appendChild(topRow);
        info.appendChild(lastMsg);

        item.appendChild(avatar);
        item.appendChild(info);

        if (c.unread > 0) {
            var badge = document.createElement('span');
            badge.className = 'unread';
            badge.textContent = c.unread;
            item.appendChild(badge);
        }

        list.appendChild(item);
    });
}

// ============================================
// Filter Chats
// ============================================
function filterChats(type) {
    var opts = document.querySelectorAll('.send-option[data-filter]');
    opts.forEach(function(el) { el.classList.remove('active'); });
    var active = document.querySelector('.send-option[data-filter="' + type + '"]');
    if (active) active.classList.add('active');
    renderChatList(type);
}

// ============================================
// Open Chat & Load Messages from API
// ============================================
async function openChat(id) {
    activeChatId = id;
    var chat = chats.find(function(c) { return c.id === id; });
    if (!chat) return;

    document.getElementById('chatName').textContent = chat.name || '';
    document.getElementById('chatAvatar').textContent = (chat.name || '?')[0];
    document.getElementById('chatAvatar').style.background = chat.avatar || 'var(--primary)';
    document.getElementById('chatStatus').textContent = chat.online ? '🟢 متصل الآن' : '🟡 آخر ظهور أمس';

    renderChatList();
    if (window.innerWidth < 768) hideSidebar();

    // Load messages from API
    await loadMessages(id);
}

async function loadMessages(chatId) {
    try {
        var resp = await fetch('/api/v1/messages/' + chatId, {
            headers: getAuthHeaders()
        });
        if (resp.ok) {
            var data = await resp.json();
            var container = document.getElementById('chatMessages');
            // Clear safely
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            (data.messages || []).forEach(function(msg) {
                appendMessage(msg.content, msg.sender_id === getCurrentUserId() ? 'sent' : 'received', msg.time);
            });
            scrollToBottom();
        }
    } catch(e) {
        console.error('Failed to load messages:', e);
    }
}

// ============================================
// Send Message - REAL API
// ============================================
async function sendMessage() {
    var input = document.getElementById('messageInput');
    var text = input.value.trim();
    if (!text) return;

    // Append locally (optimistic)
    appendMessage(text, 'sent', getTime());
    input.value = '';
    input.style.height = 'auto';
    sendType = 'normal';
    document.getElementById('sendOptions').style.display = 'none';

    try {
        await fetch('/api/v1/messages', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({
                conversation_id: activeChatId,
                content: text,
                type: sendType,
                reply_to: replyingTo
            })
        });
        if (replyingTo) cancelReply();
    } catch(e) {
        console.error('Failed to send message:', e);
    }
}

// ============================================
// Append Message - SAFE (NO innerHTML)
// ============================================
function appendMessage(content, type, time) {
    var container = document.getElementById('chatMessages');
    var msgDiv = document.createElement('div');
    msgDiv.className = 'bubble ' + type;

    // Reply preview
    if (replyingTo && type === 'sent') {
        var replyPreview = document.createElement('div');
        replyPreview.className = 'reply-preview';
        replyPreview.textContent = '↩️ ' + replyingTo;
        msgDiv.appendChild(replyPreview);
    }

    // Content
    var contentSpan = document.createElement('span');
    contentSpan.textContent = content;
    msgDiv.appendChild(contentSpan);

    // Time
    var timeDiv = document.createElement('div');
    timeDiv.className = 'time';
    timeDiv.textContent = time;
    if (type === 'sent') {
        var checks = document.createElement('span');
        checks.className = 'checks';
        checks.textContent = '✓';
        timeDiv.appendChild(checks);
    }
    msgDiv.appendChild(timeDiv);

    container.appendChild(msgDiv);
    scrollToBottom();
}

// ============================================
// Handle Incoming Message (WebSocket/API)
// ============================================
function handleIncomingMessage(data) {
    appendMessage(data.content, 'received', getTime());
}

// ============================================
// Send File - REAL upload
// ============================================
function sendFile(type) {
    var input = document.createElement('input');
    input.type = 'file';
    if (type === 'image') input.accept = 'image/*';
    if (type === 'video') input.accept = 'video/*';

    input.onchange = async function(e) {
        var file = e.target.files[0];
        if (!file) return;

        // Show file bubble
        var container = document.getElementById('chatMessages');
        var msgDiv = document.createElement('div');
        msgDiv.className = 'bubble sent';

        var iconSpan = document.createElement('span');
        iconSpan.textContent = type === 'image' ? '📸 ' : type === 'video' ? '🎥 ' : '📎 ';
        msgDiv.appendChild(iconSpan);

        var nameSpan = document.createElement('span');
        nameSpan.textContent = file.name;
        msgDiv.appendChild(nameSpan);

        var timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = getTime();
        msgDiv.appendChild(timeDiv);

        container.appendChild(msgDiv);
        scrollToBottom();

        // Upload to API
        var formData = new FormData();
        formData.append('file', file);
        formData.append('conversation_id', activeChatId);

        try {
            await fetch('/api/v1/files/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('safesend_token'),
                    'X-CSRF-Token': getCSRFToken()
                },
                body: formData
            });
        } catch(e) {
            console.error('Upload failed:', e);
        }
    };
    input.click();
}

// ============================================
// Helpers
// ============================================
function getTime() {
    return new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
}

function scrollToBottom() {
    var msgs = document.getElementById('chatMessages');
    setTimeout(function() { msgs.scrollTop = msgs.scrollHeight; }, 50);
}

function getCurrentUserId() {
    try {
        var token = localStorage.getItem('safesend_token');
        if (token) {
            var payload = JSON.parse(atob(token.split('.')[1]));
            return payload.user_id;
        }
    } catch(e) {}
    return null;
}

function showSidebar() {
    document.getElementById('chatSidebar').classList.add('mobile-show');
}
function hideSidebar() {
    document.getElementById('chatSidebar').classList.remove('mobile-show');
}

// ============================================
// Reply
// ============================================
function replyTo(text) {
    replyingTo = text;
    document.getElementById('replyText').textContent = text.substring(0, 50);
    document.getElementById('replyBar').style.display = 'flex';
    document.getElementById('messageInput').focus();
}
function cancelReply() {
    replyingTo = null;
    document.getElementById('replyBar').style.display = 'none';
}

// ============================================
// Voice Recording
// ============================================
async function startRecording() {
    try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.start();
        document.getElementById('voiceRecorder').style.display = 'flex';
        document.getElementById('btnMic').style.display = 'none';
        var sec = 0;
        recordingTimer = setInterval(function() {
            sec++;
            document.getElementById('recordingTime').textContent =
                String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
        }, 1000);
    } catch(e) {
        alert('لا يمكن الوصول للميكروفون');
    }
}
function cancelRecording() {
    if (mediaRecorder) mediaRecorder.stop();
    clearInterval(recordingTimer);
    document.getElementById('voiceRecorder').style.display = 'none';
    document.getElementById('btnMic').style.display = 'flex';
}
function sendVoice() {
    var time = document.getElementById('recordingTime').textContent;
    cancelRecording();
    var container = document.getElementById('chatMessages');
    var msgDiv = document.createElement('div');
    msgDiv.className = 'bubble sent';

    var span = document.createElement('span');
    span.textContent = '🎤 رسالة صوتية (' + time + ')';
    msgDiv.appendChild(span);

    var timeDiv = document.createElement('div');
    timeDiv.className = 'time';
    timeDiv.textContent = getTime();
    msgDiv.appendChild(timeDiv);

    container.appendChild(msgDiv);
    scrollToBottom();
}

// ============================================
// Auto Reply
// ============================================
function setupAutoReply(message) {
    autoReplySettings = { enabled: true, message: message };
    localStorage.setItem('autoReply', JSON.stringify(autoReplySettings));
}
function disableAutoReply() {
    autoReplySettings.enabled = false;
    localStorage.setItem('autoReply', JSON.stringify(autoReplySettings));
}

// ============================================
// Chat Settings Actions
// ============================================
function toggleDropdown(id) {
    document.getElementById(id).classList.toggle('show');
}

// ============================================
// Event Listeners
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    // Load chats
    loadChats();

    // Send button
    document.getElementById('btnSend').addEventListener('click', sendMessage);

    // Enter key
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // File options
    document.getElementById('btnFileOptions').addEventListener('click', function() {
        var opts = document.getElementById('sendOptions');
        opts.style.display = opts.style.display === 'none' ? 'flex' : 'none';
    });

    // Mic button
    document.getElementById('btnMic').addEventListener('click', startRecording);

    // Voice buttons
    document.getElementById('btnCancelRecording').addEventListener('click', cancelRecording);
    document.getElementById('btnSendVoice').addEventListener('click', sendVoice);

    // Cancel reply
    document.getElementById('btnCancelReply').addEventListener('click', cancelReply);

    // Show sidebar (mobile)
    document.getElementById('btnShowSidebar').addEventListener('click', showSidebar);

    // Chat settings dropdown
    document.getElementById('btnChatSettings').addEventListener('click', function() {
        toggleDropdown('chatSettings');
    });

    // Send options
    document.querySelectorAll('.send-option[data-type]').forEach(function(el) {
        el.addEventListener('click', function() {
            document.querySelectorAll('.send-option[data-type]').forEach(function(e) { e.classList.remove('active'); });
            el.classList.add('active');
            sendType = el.dataset.type;
        });
    });

    // Filter options
    document.querySelectorAll('.send-option[data-filter]').forEach(function(el) {
        el.addEventListener('click', function() {
            filterChats(el.dataset.filter);
        });
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.dropdown-menu') && !e.target.closest('#btnChatSettings')) {
            document.querySelectorAll('.dropdown-menu').forEach(function(d) { d.classList.remove('show'); });
        }
    });

    // WebSocket events (if WebSocketManager exists)
    if (typeof WebSocketManager !== 'undefined') {
        WebSocketManager.on('new_message', handleIncomingMessage);
        WebSocketManager.on('typing', function(data) {
            var el = document.getElementById('typingIndicator');
            el.style.display = 'flex';
            document.getElementById('typingUser').textContent = (data.user || '') + ' يكتب';
        });
        WebSocketManager.on('stop_typing', function() {
            document.getElementById('typingIndicator').style.display = 'none';
        });
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', function() {
        var q = this.value.toLowerCase();
        var items = document.querySelectorAll('.chat-item');
        items.forEach(function(item) {
            var name = (item.querySelector('.font-semibold') || {}).textContent || '';
            item.style.display = name.toLowerCase().includes(q) ? 'flex' : 'none';
        });
    });
});

// ============================================
// Typing indicator (outgoing)
// ============================================
var typingTimeout;
document.getElementById('messageInput').addEventListener('input', function() {
    if (typeof WebSocketManager !== 'undefined') {
        WebSocketManager.send('typing', { chat_id: activeChatId, is_typing: true });
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(function() {
        if (typeof WebSocketManager !== 'undefined') {
            WebSocketManager.send('typing', { chat_id: activeChatId, is_typing: false });
        }
    }, 2000);
});
</script>
</body>
</html>
