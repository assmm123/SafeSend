<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SafeSend - Admin</title>
<link rel="stylesheet" href="/static/css/safesend.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body style="background:var(--bg);color:var(--text);font-family:Tajawal;padding:20px;">
<div class="container">

<div style="background:var(--glass);border:1px solid var(--border-glass);border-radius:26px;padding:20px;margin-bottom:20px;">
<h1 style="color:var(--primary);">👑 لوحة المالك</h1></div>

<div class="grid-2 mb-4" id="adminStats"></div>

<div style="margin:16px 0;font-weight:600;">💰 إيرادات</div>
<div class="glass-card" id="revenue"></div>

<div style="margin:16px 0;font-weight:600;">👥 آخر المستخدمين</div>
<div id="usersList"></div>

<p id="loading" class="text-center text-muted" style="padding:20px;">⏳ جاري التحميل...</p>

<div class="bottom-nav">
<a href="/dashboard" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
<a href="/admin" class="nav-item active"><span class="nav-icon">👑</span>المالك</a>
</div>
</div>
<script>
const token=localStorage.getItem('safesend_token');
if(!token){window.location.href='/login';}
async function load(){
try{
const s=await fetch('/api/v1/admin/stats',{headers:{'Authorization':'Bearer '+token}});
const st=(await s.json()).stats;
document.getElementById('adminStats').innerHTML=`
<div class="stat-widget"><div class="stat-value">${st.total_users}</div><div class="stat-label">مستخدمين</div></div>
<div class="stat-widget"><div class="stat-value">${st.active_deals}</div><div class="stat-label">صفقات</div></div>
<div class="stat-widget"><div class="stat-value">$${st.total_volume}</div><div class="stat-label">حجم</div></div>
<div class="stat-widget"><div class="stat-value">${st.disputes_opened}</div><div class="stat-label">نزاعات</div></div>`;
const r=await fetch('/api/v1/admin/stats/revenue',{headers:{'Authorization':'Bearer '+token}});
const rev=(await r.json()).revenue;
document.getElementById('revenue').textContent='هذا الشهر: $'+rev.this_month;
const u=await fetch('/api/v1/admin/users',{headers:{'Authorization':'Bearer '+token}});
const users=(await u.json()).users;
document.getElementById('usersList').innerHTML=users.map(u=>`<div class="glass-card"><span style="font-weight:600;">${u.username}</span> - ${u.email} <span class="badge badge-success">${u.status}</span></div>`).join('');
}catch(e){}
document.getElementById('loading').style.display='none';
}
load();
</script>
</body></html>
