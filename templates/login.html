<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SafeSend - دخول</title>
<link rel="stylesheet" href="/static/css/safesend.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
<div class="glass-card" style="width:100%;max-width:400px;padding:30px;">
<div class="text-center mb-4"><div style="font-size:50px;">🛡️</div><h2>SafeSend</h2><p class="text-muted">منصة الوساطة الآمنة</p></div>
<div class="input-group"><span class="input-icon">📧</span><input class="input" id="email" placeholder="البريد الإلكتروني"></div>
<div class="input-group"><span class="input-icon">🔒</span><input class="input" type="password" id="password" placeholder="كلمة المرور"></div>
<div id="msg" style="display:none;padding:12px;border-radius:12px;margin:12px 0;font-size:13px;"></div>
<button class="btn btn-primary btn-block mt-3" onclick="login()">تسجيل الدخول</button>
<hr class="divider">
<div class="text-center"><p style="font-size:12px;">ليس لديك حساب؟ <a href="/register" style="color:var(--primary);">سجل الآن</a></p></div>
</div>
<script>
async function login(){
const e=document.getElementById('email').value,p=document.getElementById('password').value,m=document.getElementById('msg');
if(!e||!p){m.style.display='block';m.textContent='❌ املأ جميع الحقول';m.style.background='rgba(255,75,106,0.12)';m.style.color='var(--danger)';return;}
try{
const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
const d=await r.json();
if(r.ok){localStorage.setItem('safesend_token',d.access_token);window.location.href='/dashboard';}
else{m.style.display='block';m.textContent='❌ '+(d.message_ar||'بيانات خاطئة');m.style.background='rgba(255,75,106,0.12)';m.style.color='var(--danger)';}
}catch(x){}
}
</script>
</body></html>
