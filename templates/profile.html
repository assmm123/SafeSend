<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend - الملف الشخصي</title>
    <link rel="stylesheet" href="/static/css/safesend.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .profile-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
        .profile-tab { padding:8px 16px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border-glass); color:var(--text-muted); background:transparent; transition:all 0.2s; }
        .profile-tab.active { background:var(--primary-soft); color:var(--primary); border-color:var(--primary); }
        .tab-panel { display:none; animation:fadeIn 0.3s; }
        .tab-panel.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    </style>
</head>
<body>

<div class="container" style="padding:20px 20px 100px;">

    <div class="header">
        <div style="display:flex;align-items:center;gap:14px;">
            <div class="logo-circle">A</div>
            <div><h1>👤 الملف الشخصي</h1><p style="font-size:12px;color:var(--text-muted);">6 أقسام</p></div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="location.href='/dashboard'">🏠 الرئيسية</button>
    </div>

    <div class="profile-tabs">
        <div class="profile-tab active" data-tab="settings">⚙️ الإعدادات</div>
        <div class="profile-tab" data-tab="notifications">🔔 الإشعارات</div>
        <div class="profile-tab" data-tab="privacy">🔒 الخصوصية</div>
        <div class="profile-tab" data-tab="password">🔑 كلمة المرور</div>
        <div class="profile-tab" data-tab="sessions">📱 الجلسات</div>
        <div class="profile-tab" data-tab="reviews">⭐ تقييماتي</div>
        <div class="profile-tab" data-tab="portfolio">🎨 أعمالي</div>
    </div>

    <div id="tabContent"></div>

    <div class="bottom-nav">
        <a href="/dashboard" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="/chat" class="nav-item"><span class="nav-icon">💬</span>محادثات</a>
        <a href="/deals/new" class="nav-item"><span class="nav-icon">＋</span>جديد</a>
        <a href="/notifications" class="nav-item"><span class="nav-icon">🔔</span>تنبيهات</a>
        <a href="/profile" class="nav-item active"><span class="nav-icon">👤</span>حسابي</a>
    </div>
</div>

<script>
const panels = {
    settings: `<h3>⚙️ الإعدادات العامة</h3><div class="glass-card mt-3"><p>اللغة</p><select class="input"><option>العربية</option><option>English</option></select><p class="mt-3">المنطقة الزمنية</p><select class="input"><option>Asia/Damascus</option><option>Asia/Riyadh</option></select><button class="btn btn-primary mt-3">💾 حفظ</button></div>`,
    notifications: `<h3>🔔 إعدادات الإشعارات</h3><div class="glass-card mt-3"><label><input type="checkbox" checked> إشعارات البريد الإلكتروني</label><br><label class="mt-2"><input type="checkbox" checked> إشعارات الدفع (Push)</label><br><label class="mt-2"><input type="checkbox" checked> تحديثات الصفقات</label><br><label class="mt-2"><input type="checkbox"> رسائل المحادثة</label><button class="btn btn-primary mt-3">💾 حفظ</button></div>`,
    privacy: `<h3>🔒 إعدادات الخصوصية</h3><div class="glass-card mt-3"><label><input type="checkbox" checked> الملف الشخصي عام</label><br><label class="mt-2"><input type="checkbox" checked> إظهار التقييمات</label><br><label class="mt-2"><input type="checkbox"> إظهار حجم التعاملات</label><br><label class="mt-2"><input type="checkbox"> السماح بالرسائل من الجميع</label><button class="btn btn-primary mt-3">💾 حفظ</button></div>`,
    password: `<h3>🔑 تغيير كلمة المرور</h3><div class="glass-card mt-3"><input class="input" type="password" placeholder="كلمة المرور الحالية"><input class="input" type="password" placeholder="كلمة المرور الجديدة"><input class="input" type="password" placeholder="تأكيد كلمة المرور"><button class="btn btn-primary mt-3">💾 تغيير</button></div>`,
    sessions: `<h3>📱 الجلسات النشطة</h3><div class="glass-card mt-3"><p>📱 هذا الجهاز - Chrome - دمشق · الآن <span class="badge badge-success">حالي</span></p></div><div class="glass-card mt-2"><p>💻 Windows PC - Firefox - دبي · قبل 3 ساعات <button class="btn btn-danger btn-sm mt-2">إنهاء</button></p></div>`,
    reviews: `<h3>⭐ تقييماتي</h3><div class="glass-card mt-3"><p>⭐ 4.8 (45 تقييم)</p><div class="mt-2"><p><b>Sara</b> ⭐⭐⭐⭐⭐ - "عمل ممتاز!"</p><p><b>Ali</b> ⭐⭐⭐⭐ - "أنصح بالتعامل"</p></div></div>`,
    portfolio: `<h3>🎨 أعمالي السابقة</h3><div class="grid-2 mt-3"><div class="glass-card"><p><b>تصميم موقع</b></p><p class="text-muted">HTML/CSS/JS - $500</p></div><div class="glass-card"><p><b>تطبيق جوال</b></p><p class="text-muted">Flutter - $1500</p></div></div><button class="btn btn-primary mt-3">+ إضافة عمل</button>`
};

function showPanel(name) {
    document.getElementById('tabContent').innerHTML = panels[name] || '';
    document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${name}"]`).classList.add('active');
}

document.querySelectorAll('.profile-tab').forEach(t => {
    t.addEventListener('click', function() { showPanel(this.dataset.tab); });
});

showPanel('settings');
</script>
</body>
</html>
